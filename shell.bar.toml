# Slate Signal — per-theme [bar] override (Omarchy merges shell.<section>.toml
# into the generated shell.toml when the theme is applied). Body must carry the
# whole section: it replaces the generated [bar], it does not patch it.
# 2026-09-04: translucent bar per theme — Day lighter than Night, because the
# wallpaper frame in the bar's tone reads asymmetric on the light theme.
[bar]
background       = "#15171a"
background-alpha = 0.7
text             = "#d6d9dd"
active           = "#f18b82"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28
